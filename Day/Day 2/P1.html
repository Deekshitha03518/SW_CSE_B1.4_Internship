<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image tags</title>
    <style>
        .responsive-image {
            max-width: 100%;
            height: auto;
            display
        }
    </style>
</head>
<body>
    <img src="picture 1.webp" alt="could not find the image">
    <img src="images/picture 1.webp" alt="could not find the image">
    <!-- Common attributes and variations -->
     <img src="images/picture 1.webp" alt="could not find the image" width="500" height="300">
    <!-- title attribute -->
     <img src="images/picture 1.webp" alt="could not find the image"title="image of dog"> 

     <img src="images/picture 1.webp" alt="could not find the image" 
     style="width:200px;height:100px;border:2px solid #1b1818;">

     <!-- Responsive image via CSS -->
      <img src="images/picture 1.webp" alt="could not find the image" class="responsive-image">
</body>
</html>
