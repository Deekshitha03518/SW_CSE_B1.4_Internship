<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>List is a way to group related items for easy readability</p>
    <!-- Unordered list -->
    <ul>
        <li>Laptop</li>
        <li>Phone</li>
        <li>Tablet</li>
    </ul>
    <!-- nested unordered list -->
    <ul>
        <li>Fruits</li>
        <ul>
            <li>Apple</li>
            <li>Banana</li>
            <li>Orange</li>
        </ul>
    </ul>
</body>
</html>
