<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>List is a way to group related items for easy readability</p>
    <!-- Unordered list -->
    <ul>
        <li>Laptop</li>
        <li>Phone</li>
        <li>Tablet</li>
    </ul>
    <!-- nested unordered list -->
    <ul>
        <li>Fruits</li>
        <ul>
            <li>Apple</li>
            <li>Banana</li>
            <li>Orange</li>
        </ul>
    </ul>
    <p>Ordered list:renders the text with a sequential numbering</p>
    <ol>
        <li>Spoons</li>
        <li>Fork</li>
    </ol>
    <p>Ordered list type</p>
    <ol type="A">
        <li>Spoons</li>
        <li>fork</li>
    </ol>
</body>
</html>
