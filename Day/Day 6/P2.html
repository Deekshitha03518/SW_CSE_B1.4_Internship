<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text alignment and transformation,Decoration,shadow,spacing</title>
    <style>
        .centre{
            text-align: center;
        }
        .justify{
            text-align: justify;
        }
        h1{
            text-transform: uppercase;
            text-decoration: overline;
            text-shadow: 2px 2px 5px red;
            letter-spacing: 1.5px;
        }
        p{
            word-spacing: 5px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <p class="centre">Text alignment and transformation</p>
    <p>This is a paragraph.</p>
    <p class="justify">This is a justified paragraph.</p>
    <h1>Heading 1</h1>
    <p>text-shadow:offset-x offset-y blur-radius color </p>
    <p>Spacing:b/w characters,b/w words,b/w lines</p>
</body>
</html>
