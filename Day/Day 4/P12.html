<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sibling selector</title>
    <style>
        h1 + p{
            color: blue;
            background-color: green;
        }
        h2 ~ p{
            color: red;
            background-color: yellow;
        }
    </style>
</head>
<body>
    <p>Sibling: The very next element</p>
    <h1>Heading 1</h1>
    <p>Paragraph a after heading 1</p>
    <p>Paragraph 2</p>

    <h2>Heading 2</h2>
    <p>Paragraph b after heading 2</p>
    <p>Paragraph 3</p>
</body>
</html>
