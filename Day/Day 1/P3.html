<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperlink tag</title>
</head>
<body>
    <a href="https://www.google.com/">Opens google</a>
    <a href="P2.html">Opens P2.html</a>
     <!-- Attributes of a tag -->
      <a href="https://www.google.com/" target="_self">takes me to google.com</a>
      <a href="https://www.google.com/" target="_blank">opens google.com in a new tab</a>
      <a href="https://www.google.com/" target="_top">opens google.com in the top frame</a>
      <a href="https://www.google.com/" title="_parent"></a>
</body>
</html>
