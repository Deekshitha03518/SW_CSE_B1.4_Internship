<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Justify-content & align-items</title>
    <style>
        .container{
            display: flex;
            border: 2px solid black;
            padding:10px;
            gap:10px;

             justify-content: center; 
             /* flex-start , flex-end */
        }
        .item
        {
            background-color: rgb(223, 165, 90);
            padding: 15px;
        }
        .container1{
            display: flex;
            border: 2px solid rgb(23, 188, 39);
            padding:20px;
            gap:10px;
            height: 200px;
            align-items:centre;
            /* strech| flex-start| flex-end| baseline */
        }
        .item1
        {
            background-color: rgb(239, 38, 12);
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>
    <div class="container1">
        <div class="item1">Item 1</div>
        <div class="item1">Item 2</div>
        <div class="item1">Item 3</div>
    </div>
</body>
</html>
