<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Styling</title>
    <style>
        h1{
            font-weight: bold;
            font-family: cursive;
        }
        span{
            font: italic bold 17px Arial, sans-serif;
        }
        em{
            font-style: oblique;
        }
        cite{
            font-style: italic;
        }
    </style>
</head>
<body>
    <!-- Text Styling: Lets us control how text looks and behave on a web page.
        Size,font,alignment,spacing and many more things.
        1.Font properties:
        >>font-family
        >>font-size
        >>font-weight
        >>font-style
        >>font shorthand -->
    <h1>Font Styling</h1>
    <span>Font shorthand representing line</span>
    <p> Lets us control <em>how text looks and behave</em> on a <cite> web page.</cite>
    </p>
</body>
</html>
