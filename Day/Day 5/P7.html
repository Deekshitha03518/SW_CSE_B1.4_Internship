<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSL colors</title>
    <style>
        /* HSL colors: Hue[0-360](0:red,120:green,240:blue),
        saturation[0-100%],how vivid or grey the color is,
         lightness[0-100%] ,how light or dark the color is 
         transparency[0-1] */
        p {
            color: hsl(270, 92%, 43%); /* Red */
            font-size: x-large;
        }
        h1 {
            color: hsla(120, 100%, 25%, 0.5); /* Green with transparency */
        }
     </style>
</head>
<body>
    <p>Paragraph</p>
    <h1>Heading 1</h1>
</body>
</html>
