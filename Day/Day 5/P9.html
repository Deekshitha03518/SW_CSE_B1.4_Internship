<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Units All in one example</title>
    <style>
        html{
            font-size:16px;
        }
        body{
            font-size: 1rem;
            margin: 0;
            padding: 0;
        }
        .container{
            background-color: brown;
            max-width: 1200px;  
            width: 90%;
            margin: 0 auto;
            padding: 2rem 1 rem;
        }
        h1{
            font-size: 2.5rem;
            margin-bottom:0.5em;
        }
        p{
            font-size: 1rem;
            line-height: 1.6;
            max-width: 65px;
        }
        .Women{
            height: 50vh;
            font-size: 5vw;
            background-color: beige;
        }
    </style>
</head>
<body>
    <div class="Women">
        <h1>Deekshitha K</h1>
    </div>
    <div class="container">
        <h1>CSS Units</h1>
        <p>Example for CSS Units usage</p>
    </div>
</body>
</html>
