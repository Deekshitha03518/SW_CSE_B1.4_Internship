<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB,RGBA colors</title>
    <style>
        p {
            color: rgb(155, 47, 62); /* Red */
        }
        h1 {
            color: rgba(4, 34, 4, 0.5); /* Green with transparency */
        }
     </style>

    <p>Paragraph</p>
    <h1>Heading 1</h1>
</body>
